defaults: &defaults
  working_directory: ~/ffxiv-teamcraft
  docker:
    - image: cimg/node:22.14-browsers


version: 2.1

commands:
  install_bun:
    description: Install Bun and add it to PATH for subsequent steps
    steps:
      - run:
          name: Install Bun
          command: |
            curl -fsSL https://bun.sh/install | bash
            echo 'export PATH="$HOME/.bun/bin:$PATH"' >> $BASH_ENV


jobs:
  setup:
    <<: *defaults
    resource_class: xlarge
    steps:
      - checkout
      - run:
          name: Show current branch
          command: echo ${CIRCLE_BRANCH}
      - install_bun
      - restore_cache:
          name: Restore Bun package cache
          keys:
            - bun-packages-{{ checksum "bun.lock" }}
            - bun-packages-
      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile --ignore-scripts
      - save_cache:
          name: Save Bun package cache
          key: bun-packages-{{ checksum "bun.lock" }}
          paths:
            - ~/.bun/install/cache
      - persist_to_workspace:
          root: ~/
          paths:
            - ffxiv-teamcraft/*
            - .cache/*


  lint:
    <<: *defaults
    steps:
      - attach_workspace:
          at: ~/
      - install_bun
      - run:
          name: Lint
          command: bun run lint


  test:
    <<: *defaults
    steps:
      - attach_workspace:
          at: ~/
      - install_bun
      - run:
          name: Test
          command: bun run test
      - run:
          name: Codecov upload
          command: bun run codecov


  build:
    <<: *defaults
    resource_class: large
    steps:
      - attach_workspace:
          at: ~/
      - install_bun
      - run:
          name: Build web
          command: |
            if [ "${CIRCLE_BRANCH}" == "master" ]; then
                bun run build:prod
            else
                bun run build:beta
            fi
          no_output_timeout: 30m
      - persist_to_workspace:
          root: ~/
          paths:
            - ffxiv-teamcraft/dist/*
            - .cache/*


  build-api:
    <<: *defaults
    steps:
      - attach_workspace:
          at: ~/
      - install_bun
      - run:
          name: Build API
          command: bun run api:build
      - persist_to_workspace:
          root: ~/
          paths:
            - ffxiv-teamcraft/dist/*
            - .cache/*


  deploy-hosting:
    working_directory: ~/ffxiv-teamcraft
    docker:
      - image: google/cloud-sdk
    steps:
      - attach_workspace:
          at: ~/
      - add_ssh_keys:
          fingerprints:
            - "fe:16:5e:5a:4c:4a:3e:36:80:a7:13:5b:1f:64:7b:e0"
      - run:
          name: Deploy CDN to OVH server
          command: bash tools/cdn/deploy.sh
      - store_artifacts:
          path: ./rsync.log


  deploy-firebase-hosting:
    <<: *defaults
    steps:
      - attach_workspace:
          at: ~/
      - install_bun
      - run:
          name: Deploy web to Firebase
          command: ./node_modules/.bin/firebase deploy -P default --only hosting --token "$FIREBASE_TOKEN"


  deploy-api:
    working_directory: ~/ffxiv-teamcraft
    docker:
      - image: google/cloud-sdk
    steps:
      - attach_workspace:
          at: ~/
      - run:
          name: Authorize GCloud
          command: echo $GCLOUD_SERVICE_KEY | gcloud auth activate-service-account --key-file=-
      - run:
          name: Deploy Cloud Run TC API
          command: >
            gcloud builds submit --config ./apps/api/cloudbuild.yaml . &&
            gcloud beta run deploy api --image gcr.io/ffxivteamcraft/api
            --region us-central1 --allow-unauthenticated
            --update-secrets=XIVAPI_KEY=XIVAPI_KEY:latest
            --update-secrets=FFCAFE_KEY=FFCAFE_KEY:latest


  # Builds and publishes the Windows Squirrel installer via Linux cross-compilation.
  # Replaces the old Windows executor job — mono is all that is needed for Squirrel.
  # Sign credentials are read from WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD env vars;
  # signing is skipped automatically when they are not set.
  release-desktop:
    <<: *defaults
    resource_class: large
    steps:
      - checkout
      - install_bun
      - restore_cache:
          name: Restore Bun package cache
          keys:
            - bun-packages-{{ checksum "bun.lock" }}
            - bun-packages-
      - run:
          name: Install Mono (Squirrel.exe runs via Mono on Linux)
          command: sudo apt-get update -qq && sudo apt-get install -y mono-complete
      - run:
          name: Install osslsigncode (Authenticode signing on Linux)
          command: sudo apt-get install -y osslsigncode
      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile
      - run:
          name: Build and publish Windows installer
          command: bun run build:windows:publish
          no_output_timeout: 30m
      - persist_to_workspace:
          root: ~/
          paths:
            - ffxiv-teamcraft/release/*


  release-desktop-linux:
    <<: *defaults
    resource_class: large
    steps:
      - checkout
      - install_bun
      - restore_cache:
          name: Restore Bun package cache
          keys:
            - bun-packages-{{ checksum "bun.lock" }}
            - bun-packages-
      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile
      - run:
          name: Build and publish AppImage
          command: bun run build:appimage:publish
          no_output_timeout: 30m


  deploy-staging:
    <<: *defaults
    steps:
      - attach_workspace:
          at: ~/
      - install_bun
      - run:
          name: Deploy staging to Firebase
          command: ./node_modules/.bin/firebase deploy -P beta --only hosting --token "$FIREBASE_TOKEN"


workflows:
  version: 2
  flow:
    jobs:
      - setup
      - lint:
          requires:
            - setup
      - build:
          requires:
            - lint
      - build-api:
          requires:
            - lint
      - deploy-hosting:
          requires:
            - build
          filters:
            branches:
              only: master
      - deploy-api:
          requires:
            - build-api
          filters:
            branches:
              only: master
      - deploy-firebase-hosting:
          requires:
            - deploy-hosting
          filters:
            branches:
              only: master
      - release-desktop:
          requires:
            - lint
          filters:
            branches:
              only: master
      - release-desktop-linux:
          requires:
            - lint
          filters:
            branches:
              only: master
      - deploy-staging:
          requires:
            - build
          filters:
            branches:
              only: staging
